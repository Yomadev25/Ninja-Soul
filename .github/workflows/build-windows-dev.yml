name: Build Windows (Dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-windows-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build StandaloneWindows64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: NinjaSoul

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NinjaSoul-Windows-${{ github.sha }}
          path: build/StandaloneWindows64
          retention-days: 10

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            COLOR=3066993
            TITLE="✅ Windows Dev Build สำเร็จ"
          else
            COLOR=15158332
            TITLE="❌ Windows Dev Build ล้มเหลว"
          fi
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg sha "${SHA:0:7}" \
            --arg url "$RUN_URL" \
            '{embeds: [{title: $title, color: $color, url: $url, fields: [
              {name: "Repo", value: $repo, inline: true},
              {name: "Branch", value: $branch, inline: true},
              {name: "Commit", value: $sha, inline: true}
            ]}]}')
          curl -sf -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
