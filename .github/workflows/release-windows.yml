name: Release Windows

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build StandaloneWindows64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: NinjaSoul
          versioning: Tag

      - name: Zip build
        run: |
          cd build/StandaloneWindows64
          zip -r ../../NinjaSoul-${{ github.ref_name }}-Windows.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NinjaSoul-${{ github.ref_name }}-Windows.zip
          name: ${{ github.ref_name }}
