name: Release Windows

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build StandaloneWindows64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: NinjaSoul
          versioning: Tag

      - name: Zip build
        run: |
          cd build/StandaloneWindows64
          zip -r ../../NinjaSoul-${{ github.ref_name }}-Windows.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NinjaSoul-${{ github.ref_name }}-Windows.zip
          name: ${{ github.ref_name }}

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            COLOR=3066993
            TITLE="✅ Windows Release Build สำเร็จ"
          else
            COLOR=15158332
            TITLE="❌ Windows Release Build ล้มเหลว"
          fi
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --arg repo "$REPO" \
            --arg tag "$TAG" \
            --arg url "$RUN_URL" \
            '{embeds: [{title: $title, color: $color, url: $url, fields: [
              {name: "Repo", value: $repo, inline: true},
              {name: "Tag", value: $tag, inline: true}
            ]}]}')
          curl -sf -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
